    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does BugRank fundamentally differ from conventional competitive programming platforms?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Traditional platforms ask you to implement an algorithm from a blank slate to pass synthetic test vectors. BugRank immerses you in real production incidents: existing codebases with concurrency races, off-by-one pointer corruptions, memory leaks, and distributed split-brains. You must diagnose root causes using call stacks, telemetry, and minimal-diff surgery."
            }
          },
          {
            "@type": "Question",
            "name": "How are the sandboxed execution environments secured and measured?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every submission executes inside a micro-containerized runtime with deterministic CPU cycles, hard memory limits, and trace instrumentation. We measure execution latency, heap fragmentation, and source diff invariants to evaluate patch precision."
            }
          },
          {
            "@type": "Question",
            "name": "What criteria govern the scoring formula?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Submissions are scored on three orthogonal pillars: (1) Correctness across adversarial edge cases, (2) Patch conciseness (fewer lines modified yields a higher precision rating), and (3) Memory and CPU efficiency deltas between original and patched execution."
            }
          },
          {
            "@type": "Question",
            "name": "Which languages and hardware runtimes are currently supported?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We currently support C++20 (GCC/Clang with AddressSanitizer and ThreadSanitizer enabled), Java 21 LTS with JVM heap diagnostics, Rust 1.76+, and Go 1.22. Every runtime includes full symbol demangling and stack unwinding."
            }
          },
          {
            "@type": "Question",
            "name": "Can I track my global standing and share verified credentials?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every verified patch contributes to your global Elo rank on the public leaderboard. You can showcase verified surgical badges, diagnostic precision rates, and specialized domain competencies on your engineering portfolio."
            }
          }
        ]
      }
    </script>

          } else {
            document.documentElement.classList.remove('dark');
          }
